services:
  wishlist:
    image: ghcr.io/floholz/wishlist:latest
    build: .
    container_name: wishlist
    restart: unless-stopped
    volumes:
      - ./data:/pb_data
    environment:
      # accounts are optional; "false" disables sign-up (lists still work without accounts)
      WISHLIST_REGISTRATION: "true"
      # optional: PocketBase superuser for the admin UI at /_/ (created once, on first start)
      # WISHLIST_ADMIN_EMAIL: you@example.com
      # WISHLIST_ADMIN_PASSWORD: change-me-please
      # optional: "Continue with Google" (redirect URI: https://<domain>/api/oauth2-redirect)
      # WISHLIST_GOOGLE_CLIENT_ID: xxx.apps.googleusercontent.com
      # WISHLIST_GOOGLE_CLIENT_SECRET: xxx
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.http.routers.wishlist.rule: "Host(`wish.fhun.site`)"
      traefik.http.routers.wishlist.entrypoints: "websecure"
      traefik.http.routers.wishlist.tls.certresolver: "letsencrypt"
      traefik.http.services.wishlist.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
